[package]
name = "octopux-cli"
version.workspace = true
edition.workspace = true
description = "CLI to generate base models for octopux"
license.workspace = true
repository.workspace = true
authors.workspace = true
readme.workspace = true
keywords = ["actix", "crud", "codegen", "migrations", "cli"]
categories = ["command-line-utilities", "development-tools"]
default-run = "octopux"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
structopt.workspace = true
chrono.workspace = true
# Column types of the generated migrations, from the sqlx type of the fields
sqlx = { workspace = true, features = ["mysql"] }
# Runs the queries listing the tables of DATABASE_URL, proposed to the foreign keys
tokio = { version = "1", features = ["rt", "net", "time"] }

[[bin]]
name = "octopux"
path = "src/main.rs"
