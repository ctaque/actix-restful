[package]
name = "actix-restful"
version.workspace = true
edition.workspace = true
description = "Generate JSON REST APIs for Actix with minimal boilerplate"
license.workspace = true
repository.workspace = true
authors.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# Derive macros, re-exported so that depending on actix-restful is enough
actix-restful-derive.workspace = true
actix-web.workspace = true
anyhow.workspace = true
async-trait.workspace = true
# Deserializes the path parameters of the generated handlers
serde.workspace = true
serde_json.workspace = true
apistos = { workspace = true, optional = true }

[features]
openapi = ["dep:apistos"]

[dev-dependencies]
apistos.workspace = true
schemars.workspace = true
chrono.workspace = true

[[test]]
name = "openapi"
required-features = ["openapi"]
