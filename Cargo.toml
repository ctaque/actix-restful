[workspace]
resolver = "2"


members = [
    "octopux",
    "octopux-derive",
    "octopux-cli",
    "examples/*",
]

[workspace.package]
version = "0.18.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/ctaque/octopux"
authors = ["Cyprien Taque"]
readme = "README.md"

[profile.release.build-override]
strip = false

[workspace.dependencies]
# Crates internes
octopux = { version = "0.18.0", path = "octopux" }
octopux-derive = { version = "0.18.0", path = "octopux-derive" }

# Dépendances externes
actix-web = "4"
apistos = "0.9"
anyhow = "1.0.51"
async-trait = "0.1.52"
chrono = { version = "0.4.19", features = ["serde"] }
darling = "0.24.1"
schemars = { package = "apistos-schemars", version = "0.8" }
proc-macro2 = "1.0.34"
quote = "1.0.10"
serde = { version = "1.0.132", features = ["derive"] }
serde_json = "1.0.73"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "postgres", "chrono", "macros", "migrate"] }
structopt = "0.3"
syn = { version = "3.0.6", features = ["full"] }
