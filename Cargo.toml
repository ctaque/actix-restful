[workspace]
resolver = "2"

members = [
    "actix-restful",
    "actix-restful-derive",
    "actix-restful-cli",
    "examples/*",
]

[workspace.package]
version = "0.4.8"
edition = "2021"

[workspace.dependencies]
# Crates internes
actix-restful = { version = "0.4.8", path = "actix-restful" }
actix-restful-derive = { version = "0.4.8", path = "actix-restful-derive" }

# Dépendances externes
actix-web = "4"
apistos = "0.9"
anyhow = "1.0.51"
async-trait = "0.1.52"
chrono = { version = "0.4.19", features = ["serde"] }
darling = "0.13.1"
schemars = { package = "apistos-schemars", version = "0.8" }
proc-macro2 = "1.0.34"
quote = "1.0.10"
serde = { version = "1.0.132", features = ["derive"] }
serde_json = "1.0.73"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "postgres", "chrono", "macros", "migrate"] }
structopt = "0.3"
syn = { version = "1.0.82", features = ["full"] }
