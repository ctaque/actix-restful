[package]
name = "actix-restful-cli"
version.workspace = true
edition.workspace = true
description = "CLI to generate base models for actix-restful"
license.workspace = true
repository.workspace = true
authors.workspace = true
default-run = "actix-restful"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
structopt.workspace = true
chrono.workspace = true
# Column types of the generated migrations, from the sqlx type of the fields
sqlx = { workspace = true, features = ["mysql"] }

[[bin]]
name = "actix-restful"
path = "src/main.rs"
